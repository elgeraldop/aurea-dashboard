<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AUREA Enterprises - Digital Office</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0B0F19;
  --bg-elevated: #111827;
  --surface: rgba(17, 24, 39, 0.65);
  --surface-solid: #151D2E;
  --surface-hover: rgba(30, 41, 59, 0.8);
  --border: rgba(148, 163, 184, 0.08);
  --border-glow: rgba(148, 163, 184, 0.15);
  --text: #F1F5F9;
  --text2: #94A3B8;
  --text3: #64748B;
  --accent: #3B82F6;
  --accent-glow: rgba(59, 130, 246, 0.25);
  --accent-bg: rgba(59, 130, 246, 0.12);
  --green: #10B981;
  --green-glow: rgba(16, 185, 129, 0.25);
  --green-bg: rgba(16, 185, 129, 0.12);
  --amber: #F59E0B;
  --amber-glow: rgba(245, 158, 11, 0.25);
  --amber-bg: rgba(245, 158, 11, 0.12);
  --red: #EF4444;
  --red-bg: rgba(239, 68, 68, 0.12);
  --gold: #FBBF24;
  --gold-glow: rgba(251, 191, 36, 0.3);
  --gold-bg: rgba(251, 191, 36, 0.1);
  --gold-border: rgba(251, 191, 36, 0.25);
  --sidebar-w: 270px;
  --topbar-h: 56px;
  --radius: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --shadow: 0 1px 3px rgba(0,0,0,0.3);
  --shadow-md: 0 8px 32px rgba(0,0,0,0.4), 0 2px 8px rgba(0,0,0,0.3);
  --shadow-glow: 0 0 40px rgba(59, 130, 246, 0.08);
  --gap: 20px;
  --vh: 1vh;
  --trans: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  --trans-slow: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { height: 100%; }
body {
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.5;
  height: 100%;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  -webkit-overflow-scrolling: touch;
  background-image: 
    radial-gradient(ellipse at 20% 0%, rgba(59, 130, 246, 0.07) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 100%, rgba(245, 158, 11, 0.05) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 50%, rgba(16, 185, 129, 0.03) 0%, transparent 60%);
  background-attachment: fixed;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; }
a { text-decoration: none; color: inherit; }
input, textarea { font-family: inherit; }
.app { display: flex; flex-direction: column; height: calc(var(--vh, 1vh) * 100); }

.topbar {
  height: var(--topbar-h);
  background: rgba(11, 15, 25, 0.75);
  backdrop-filter: blur(20px) saturate(1.2);
  -webkit-backdrop-filter: blur(20px) saturate(1.2);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 20px;
  gap: 14px;
  position: sticky;
  top: 0;
  z-index: 300;
  flex-shrink: 0;
  -webkit-transform: translateZ(0);
  transform: translateZ(0);
}
.topbar-hamburger {
  display: none;
  align-items: center;
  justify-content: center;
  width: 38px;
  height: 38px;
  border-radius: 10px;
  color: var(--text2);
  transition: all var(--trans);
  flex-shrink: 0;
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--border);
}
.topbar-hamburger:hover, .topbar-hamburger:active { background: rgba(255,255,255,0.08); color: var(--text); }
.topbar-hamburger svg { width: 20px; height: 20px; }
.topbar-brand { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
.brand-logo {
  width: 36px; height: 36px;
  background: linear-gradient(135deg, #1D293F 0%, #0F172A 100%);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 800; color: var(--gold);
  letter-spacing: 0.5px;
  box-shadow: 0 0 20px rgba(251, 191, 36, 0.15), inset 0 1px 0 rgba(255,255,255,0.1);
  border: 1px solid rgba(251, 191, 36, 0.2);
}
.brand-name { font-size: 15px; font-weight: 700; color: var(--text); letter-spacing: -0.3px; }
.brand-sub { font-size: 11px; color: var(--text3); font-weight: 500; }
.topbar-stats { display: flex; align-items: center; gap: 20px; margin-left: auto; }
.tstat { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text2); font-weight: 500; }
.tstat-val { font-weight: 700; color: var(--text); }
.tstat-bar { width: 80px; height: 5px; background: rgba(255,255,255,0.06); border-radius: 3px; overflow: hidden; }
.tstat-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--green)); border-radius: 3px; transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 0 8px rgba(59, 130, 246, 0.3); }
.topbar-right { display: flex; align-items: center; gap: 10px; margin-left: 16px; }
.topbar-date { font-size: 11px; color: var(--text3); white-space: nowrap; font-weight: 500; }
.sync-badge {
  font-size: 10px; font-weight: 600;
  padding: 4px 10px;
  border-radius: 20px;
  background: var(--green-bg);
  color: var(--green);
  white-space: nowrap;
  transition: all var(--trans);
  border: 1px solid rgba(16, 185, 129, 0.2);
  backdrop-filter: blur(4px);
}
.sync-badge.syncing { background: var(--amber-bg); color: var(--amber); border-color: rgba(245, 158, 11, 0.2); }
.sync-badge.error { background: var(--red-bg); color: var(--red); border-color: rgba(239, 68, 68, 0.2); }
.btn-topbar {
  height: 34px;
  padding: 0 14px;
  border-radius: var(--radius);
  font-size: 12px;
  font-weight: 600;
  display: flex; align-items: center; gap: 6px;
  transition: all var(--trans);
  white-space: nowrap;
  min-width: 44px;
  letter-spacing: 0.2px;
}
.btn-topbar-ghost { border: 1px solid var(--border); color: var(--text2); background: rgba(255,255,255,0.03); }
.btn-topbar-ghost:hover { background: rgba(255,255,255,0.08); color: var(--text); border-color: var(--border-glow); }
.btn-topbar-accent { 
  background: linear-gradient(135deg, #3B82F6 0%, #2563EB 100%); 
  color: #fff; 
  box-shadow: 0 0 16px rgba(59, 130, 246, 0.25), inset 0 1px 0 rgba(255,255,255,0.15);
  border: 1px solid rgba(59, 130, 246, 0.3);
}
.btn-topbar-accent:hover { 
  background: linear-gradient(135deg, #2563EB 0%, #1D4ED8 100%); 
  box-shadow: 0 0 24px rgba(59, 130, 246, 0.35);
  transform: translateY(-1px);
}

.body-wrap { display: flex; flex: 1; overflow: hidden; position: relative; }
.sidebar-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  backdrop-filter: blur(4px);
  z-index: 400;
}
.sidebar-overlay.visible { display: block; }

.sidebar {
  width: var(--sidebar-w);
  background: rgba(17, 24, 39, 0.7);
  backdrop-filter: blur(24px) saturate(1.3);
  -webkit-backdrop-filter: blur(24px) saturate(1.3);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  overflow: hidden;
  transition: transform var(--trans);
  height: 100%;
  z-index: 450;
}
.sidebar-header { padding: 20px 16px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.sidebar-section-label {
  font-size: 10px; font-weight: 700; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--text3);
  padding: 0 10px;
}
.sidebar-scroll {
  flex: 1; overflow-y: auto; padding: 10px 0 24px;
  -webkit-overflow-scrolling: touch;
}
.sidebar-scroll::-webkit-scrollbar { width: 4px; }
.sidebar-scroll::-webkit-scrollbar-thumb { background: rgba(148,163,184,0.15); border-radius: 3px; }
.sidebar-item {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 16px;
  cursor: pointer;
  transition: all var(--trans);
  min-height: 48px;
  touch-action: manipulation;
  position: relative;
  border: none; background: none;
  width: 100%; text-align: left;
  border-radius: 0 10px 10px 0;
  margin-right: 8px;
}
.sidebar-item:hover { background: rgba(255,255,255,0.04); }
.sidebar-item.active { 
  background: linear-gradient(90deg, rgba(59, 130, 246, 0.15) 0%, rgba(59, 130, 246, 0.05) 100%); 
}
.sidebar-item.active::before {
  content: '';
  position: absolute;
  left: 0; top: 6px; bottom: 6px;
  width: 3px;
  background: linear-gradient(180deg, var(--accent), var(--green));
  border-radius: 0 3px 3px 0;
  box-shadow: 0 0 8px var(--accent-glow);
}
.si-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; box-shadow: 0 0 8px currentColor; }
.si-info { flex: 1; min-width: 0; }
.si-name { font-size: 13px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -0.2px; }
.sidebar-item.active .si-name { color: var(--accent); text-shadow: 0 0 12px var(--accent-glow); }
.si-meta { font-size: 11px; color: var(--text3); margin-top: 2px; font-weight: 500; }
.si-progress { width: 36px; height: 4px; background: rgba(255,255,255,0.06); border-radius: 2px; overflow: hidden; flex-shrink: 0; }
.si-progress-fill { height: 100%; border-radius: 2px; transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 0 6px currentColor; }
.sidebar-divider { height: 1px; background: var(--border); margin: 10px 16px; }
.sidebar-tip {
  margin: 0 12px;
  padding: 12px 14px;
  background: linear-gradient(135deg, rgba(251, 191, 36, 0.08) 0%, rgba(251, 191, 36, 0.03) 100%);
  border: 1px solid var(--gold-border);
  border-left: 3px solid var(--gold);
  border-radius: 0 var(--radius) var(--radius) 0;
  font-size: 11px; color: var(--text2); font-style: italic; line-height: 1.6;
  backdrop-filter: blur(4px);
}

.main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; background: transparent; }
.panel { display: none; animation: fadeIn 0.4s ease; }
.panel.active { display: block; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.block-section-title {
  font-size: 10px; font-weight: 700; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--text3);
  margin-bottom: 14px;
  display: flex; align-items: center; gap: 10px;
}
.block-section-title::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--border), transparent); }
.block {
  background: var(--surface);
  backdrop-filter: blur(16px);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 18px 22px;
  transition: all var(--trans);
  box-shadow: var(--shadow);
}
.block:hover { 
  box-shadow: var(--shadow-md), var(--shadow-glow); 
  border-color: var(--border-glow); 
  transform: translateY(-2px);
}
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }

.kpi-block, .kpi-card {
  background: var(--surface);
  backdrop-filter: blur(16px);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 18px 22px;
  cursor: pointer; transition: all var(--trans);
  position: relative; overflow: hidden; min-height: 130px;
  touch-action: manipulation;
  box-shadow: var(--shadow);
}
.kpi-block:hover, .kpi-card:hover { 
  box-shadow: var(--shadow-md), var(--shadow-glow); 
  border-color: var(--border-glow); 
  transform: translateY(-3px);
}
.kpi-block:active, .kpi-card:active { transform: scale(0.98); }
.kpi-label, .kc-label { font-size: 10px; font-weight: 700; color: var(--text3); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; }
.kpi-value, .kc-val { font-size: 28px; font-weight: 800; line-height: 1; margin-bottom: 8px; letter-spacing: -0.5px; }
.kpi-target, .kc-target { font-size: 11px; color: var(--text3); margin-bottom: 12px; font-weight: 500; }
.kpi-bar, .kc-bar { height: 5px; background: rgba(255,255,255,0.06); border-radius: 3px; overflow: hidden; margin-bottom: 6px; }
.kpi-bar-fill, .kc-bar-fill { height: 100%; border-radius: 3px; transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 0 10px currentColor; }
.kpi-pct, .kc-pct { font-size: 10px; color: var(--text3); font-weight: 600; }
.kpi-edit-btn {
  position: absolute; top: 14px; right: 14px;
  width: 30px; height: 30px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; color: var(--text3);
  opacity: 0; transition: all var(--trans);
  background: rgba(255,255,255,0.05); border: 1px solid var(--border);
}
.kpi-block:hover .kpi-edit-btn, .kpi-card:hover .kpi-edit-btn { opacity: 1; }
.kpi-edit-btn:hover { background: rgba(255,255,255,0.1); color: var(--text); }

.company-progress {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 18px;
  background: var(--surface);
  backdrop-filter: blur(12px);
  border: 1px solid var(--border);
  border-radius: var(--radius); cursor: pointer;
  transition: all var(--trans); min-height: 60px; touch-action: manipulation;
  box-shadow: var(--shadow);
}
.company-progress:hover { 
  box-shadow: var(--shadow-md); 
  border-color: var(--border-glow); 
  transform: translateY(-2px);
}
.company-progress:active { transform: scale(0.99); }
.cp-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; box-shadow: 0 0 10px currentColor; }
.cp-info { flex: 1; min-width: 0; }
.cp-name { font-size: 14px; font-weight: 700; color: var(--text); letter-spacing: -0.2px; }
.cp-sub { font-size: 11px; color: var(--text3); margin-top: 3px; font-weight: 500; }
.cp-bar { width: 72px; height: 5px; background: rgba(255,255,255,0.06); border-radius: 3px; overflow: hidden; flex-shrink: 0; }
.cp-fill { height: 100%; border-radius: 3px; transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 0 8px currentColor; }
.cp-pct { font-size: 12px; font-weight: 700; color: var(--text2); min-width: 32px; text-align: right; }
.cp-arrow { color: var(--text3); font-size: 14px; transition: transform var(--trans); }
.company-progress:hover .cp-arrow { transform: translateX(3px); color: var(--text); }

.page-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.chip {
  font-size: 11px; font-weight: 600; padding: 4px 12px;
  border-radius: 20px; border: 1px solid var(--border);
  color: var(--text2); background: rgba(255,255,255,0.03);
  transition: all var(--trans);
  backdrop-filter: blur(4px);
}
.chip:hover { border-color: var(--border-glow); background: rgba(255,255,255,0.06); }
.chip.accent { background: var(--accent-bg); color: var(--accent); border-color: rgba(59, 130, 246, 0.2); box-shadow: 0 0 12px var(--accent-glow); }
.chip.green { background: var(--green-bg); color: var(--green); border-color: rgba(16, 185, 129, 0.2); box-shadow: 0 0 12px var(--green-glow); }
.chip.amber { background: var(--amber-bg); color: var(--amber); border-color: rgba(245, 158, 11, 0.2); box-shadow: 0 0 12px var(--amber-glow); }
.chip.gold { background: var(--gold-bg); color: var(--gold); border-color: var(--gold-border); box-shadow: 0 0 12px var(--gold-glow); }

.empresa-header {
  padding: 28px var(--gap) 20px;
  background: var(--surface);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  box-shadow: 0 4px 24px rgba(0,0,0,0.2);
}
.empresa-title-row {
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 16px; flex-wrap: wrap;
}
.empresa-title { font-size: 26px; font-weight: 800; line-height: 1.2; letter-spacing: -0.5px; }
.empresa-tagline { font-size: 13px; color: var(--text2); margin-top: 6px; font-weight: 500; }
.empresa-pct-circle { text-align: right; flex-shrink: 0; }
.epc-num { font-size: 36px; font-weight: 800; line-height: 1; letter-spacing: -1px; }
.epc-label { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; }
.empresa-progress-bar { height: 5px; background: rgba(255,255,255,0.06); border-radius: 3px; margin-top: 20px; overflow: hidden; }
.empresa-progress-fill { height: 100%; border-radius: 3px; transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 0 12px currentColor; }

.empresa-tabs {
  display: flex; border-bottom: 1px solid var(--border);
  background: rgba(17, 24, 39, 0.5);
  overflow-x: auto; -webkit-overflow-scrolling: touch;
  backdrop-filter: blur(12px);
}
.empresa-tab {
  padding: 14px 24px; font-size: 13px; font-weight: 600; color: var(--text3);
  border-bottom: 2px solid transparent; white-space: nowrap; min-height: 48px;
  touch-action: manipulation; transition: all var(--trans);
  border-top: none; border-left: none; border-right: none;
  background: none; cursor: pointer;
  letter-spacing: 0.2px;
}
.empresa-tab:hover { color: var(--text); }
.empresa-tab.active { color: var(--accent); border-bottom-color: var(--accent); text-shadow: 0 0 12px var(--accent-glow); }
.tab-panel { display: none; padding: var(--gap); animation: fadeIn 0.3s ease; }
.tab-panel.active { display: block; }

.consejo {
  display: flex; gap: 14px; padding: 16px 18px;
  background: linear-gradient(135deg, rgba(251, 191, 36, 0.08) 0%, rgba(251, 191, 36, 0.02) 100%);
  border: 1px solid var(--gold-border);
  border-left: 3px solid var(--gold);
  border-radius: 0 var(--radius) var(--radius) 0;
  margin-bottom: var(--gap);
  backdrop-filter: blur(8px);
  box-shadow: 0 4px 16px rgba(251, 191, 36, 0.05);
}
.consejo-icon { font-size: 18px; flex-shrink: 0; filter: drop-shadow(0 0 6px var(--gold-glow)); }
.consejo-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--gold); margin-bottom: 4px; }
.consejo-text { font-size: 13px; color: var(--text2); line-height: 1.6; font-weight: 500; }

.fase { 
  border: 1px solid var(--border); 
  border-radius: var(--radius-lg); 
  overflow: hidden; 
  margin-bottom: 12px; 
  background: var(--surface); 
  backdrop-filter: blur(12px);
  box-shadow: var(--shadow);
  transition: all var(--trans);
}
.fase:hover { border-color: var(--border-glow); }
.fase-header {
  display: flex; align-items: center; gap: 14px;
  padding: 16px 20px; cursor: pointer;
  transition: all var(--trans); min-height: 56px;
  touch-action: manipulation; border: none; background: none; width: 100%; text-align: left;
}
.fase-header:hover { background: rgba(255,255,255,0.03); }
.fase-chevron { font-size: 12px; color: var(--text3); transition: transform var(--trans); flex-shrink: 0; }
.fase.collapsed .fase-chevron { transform: rotate(-90deg); }
.fase.collapsed .fase-body { display: none; }
.fase-title { font-size: 14px; font-weight: 700; color: var(--text); flex: 1; letter-spacing: -0.2px; }
.fase-period { font-size: 11px; color: var(--text3); font-weight: 500; }
.fase-badge { font-size: 10px; font-weight: 700; padding: 3px 10px; border-radius: 20px; white-space: nowrap; letter-spacing: 0.05em; }
.fase-badge-urgente { background: var(--amber-bg); color: var(--amber); border: 1px solid rgba(245, 158, 11, 0.2); box-shadow: 0 0 8px var(--amber-glow); }
.fase-badge-madrid { background: var(--gold-bg); color: var(--gold); border: 1px solid var(--gold-border); box-shadow: 0 0 8px var(--gold-glow); }
.fase-progress { font-size: 11px; font-weight: 700; color: var(--text3); white-space: nowrap; }

.tarea {
  display: flex; align-items: flex-start; gap: 14px;
  padding: 14px 20px; border-top: 1px solid var(--border);
  cursor: pointer; transition: all var(--trans);
  touch-action: manipulation; position: relative;
}
.tarea:hover { background: rgba(255,255,255,0.03); }
.tarea:active { background: rgba(255,255,255,0.06); }
.tarea.completada { opacity: 0.45; }
.tarea.completada .tarea-text { text-decoration: line-through; color: var(--text3); }
.tarea.urgente { border-left: 3px solid var(--amber); background: linear-gradient(90deg, rgba(245, 158, 11, 0.04) 0%, transparent 100%); }
.tarea.hoy-task { border-left: 3px solid var(--accent); background: linear-gradient(90deg, rgba(59, 130, 246, 0.04) 0%, transparent 100%); }
.tarea-check {
  width: 22px; height: 22px; border: 2px solid var(--border-glow);
  border-radius: 6px; flex-shrink: 0; margin-top: 1px;
  display: flex; align-items: center; justify-content: center;
  transition: all var(--trans); background: rgba(255,255,255,0.03);
}
.tarea.completada .tarea-check { background: linear-gradient(135deg, var(--green), #059669); border-color: var(--green); box-shadow: 0 0 12px var(--green-glow); }

::-webkit-scrollbar { width: 6px; height: 6px; }

@media (max-width: 767px) {
  :root { --gap: 16px; }
  .topbar-hamburger { display: flex; }
  .topbar-stats { display: none; }
  .topbar-date { display: none; }
  .sync-badge { display: none; }
  .brand-sub { display: none; }
  .sidebar {
    position: fixed; top: 0; left: 0;
    height: 100%; height: calc(var(--vh, 1vh) * 100);
    z-index: 450;
    transform: translateX(-100%);
    -webkit-transform: translateX(-100%);
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    -webkit-transition: -webkit-transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    will-change: transform;
    -webkit-backface-visibility: hidden; backface-visibility: hidden;
  }
  .sidebar.open { transform: translateX(0); -webkit-transform: translateX(0); }
  .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid-2 { grid-template-columns: 1fr; }
  .empresa-kpi-grid { grid-template-columns: 1fr; }
  .welcome-grid { grid-template-columns: 1fr; }
  .page-title { font-size: 22px; }
  .empresa-title { font-size: 20px; }
  .kpi-value { font-size: 22px; }
  .empresa-tab { padding: 10px 14px; font-size: 12px; }
  .topbar { padding: 0 12px; }
  .countdown-unit { min-width: 44px; }
  input, textarea, select { font-size: 16px !important; }
}
@media (min-width: 768px) and (max-width: 1023px) {
  .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

.kc-task-text{font-size:12px;color:var(--text);line-height:1.4;margin-bottom:6px;font-weight:500;}
.kc-task-meta{display:flex;align-items:center;justify-content:space-between;}
.kc-task-badge{font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;}
.kbadge-urgente{background:var(--amber-bg);color:var(--amber);border:1px solid rgba(245,158,11,0.2);}
.kbadge-hoy{background:var(--accent-bg);color:var(--accent);border:1px solid rgba(59,130,246,0.2);}
.kbadge-madrid{background:var(--gold-bg);color:var(--gold);border:1px solid var(--gold-border);}
.kbadge-ok{background:var(--green-bg);color:var(--green);border:1px solid rgba(16,185,129,0.2);}
.kc-task-check{width:16px;height:16px;border:2px solid var(--border-glow);border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;transition:all var(--trans);flex-shrink:0;background:rgba(255,255,255,0.03);}
.kanban-card.done .kc-task-check{background:linear-gradient(135deg,var(--green),#059669);border-color:var(--green);box-shadow:0 0 8px var(--green-glow);}
@keyframes cardPop{0%{transform:scale(0.96);opacity:0.7;}60%{transform:scale(1.02);}100%{transform:scale(1);opacity:1;}}
.kanban-card.just-done{animation:cardPop 0.3s ease forwards;}

.calendar-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;margin-bottom:var(--gap);backdrop-filter:blur(12px);box-shadow:var(--shadow);}
.cal-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:8px;}
.cal-nav{display:flex;align-items:center;gap:8px;}
.cal-nav-btn{width:28px;height:28px;border-radius:var(--radius);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text2);font-size:14px;transition:all var(--trans);cursor:pointer;touch-action:manipulation;background:rgba(255,255,255,0.03);}
.cal-nav-btn:hover{background:rgba(255,255,255,0.08);border-color:var(--border-glow);color:var(--text);}
.cal-month-title{font-size:14px;font-weight:700;color:var(--text);min-width:140px;text-align:center;}
.cal-legend{display:flex;gap:8px;flex-wrap:wrap;}
.cal-legend-item{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--text3);font-weight:500;}
.cal-legend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;box-shadow:0 0 6px currentColor;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);}
.cal-day-header{padding:8px 4px;text-align:center;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--text3);background:rgba(255,255,255,0.03);border-bottom:1px solid var(--border);}
.cal-cell{min-height:76px;padding:4px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);vertical-align:top;}
.cal-cell:nth-child(7n){border-right:none;}
.cal-cell.other-month{background:rgba(255,255,255,0.02);}
.cal-cell.today{background:var(--gold-bg);}
.cal-cell.today .cal-day-num{color:var(--gold);font-weight:700;text-shadow:0 0 8px var(--gold-glow);}
.cal-day-num{font-size:11px;font-weight:600;color:var(--text2);margin-bottom:3px;display:block;}
.cal-event{display:block;font-size:9px;font-weight:600;padding:1px 4px;border-radius:3px;margin-bottom:2px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cal-more{font-size:9px;color:var(--text3);padding:1px 3px;}

@media (max-width:767px){.kanban-board{grid-template-columns:repeat(2,minmax(0,1fr));}.view-tabs{display:none;}}
@media (min-width:768px) and (max-width:1100px){.kanban-board{grid-template-columns:repeat(2,minmax(0,1fr));}}
</style>
</head>
