/* ===== Ajustes mobile / iPhone (solo visuales, sin tocar datos ni logica) ===== */
:root{--vh:1vh}
@supports (height:100dvh){
  [code-path="src/App.tsx:82:5"]{height:100dvh}
}
@media (max-width:640px){
  /* --- Layout raiz: deja que el contenido respire y respeta el notch/home indicator --- */
  [code-path="src/App.tsx:82:5"]{height:100vh}
  [code-path="src/App.tsx:89:7"]{padding-bottom:env(safe-area-inset-bottom)}

  /* --- Sidebar: el propio boton de colapsar/expandir ya maneja el ancho y las
     etiquetas (se montan/desmontan segun el estado real). Solo afinamos padding. --- */
  [code-path="src/components/Sidebar.tsx:76:15"]{padding:0.6rem 0}
  [code-path="src/components/Sidebar.tsx:29:7"]{padding-left:0.5rem;padding-right:0.5rem}
  /* --- Boton de colapsar/expandir: area tactil real de 44x44 (antes ~24x24, dificil de tocar) --- */
  [code-path="src/components/Sidebar.tsx:39:9"]{
    padding:0.75rem!important;min-width:2.75rem;min-height:2.75rem;
    display:flex!important;align-items:center;justify-content:center
  }

  /* --- Reloj de Madrid: se mueve abajo a la derecha para no tapar titulos --- */
  [code-path="src/components/MadridClock.tsx:1:1"]{
    top:auto;bottom:calc(0.6rem + env(safe-area-inset-bottom));
    right:0.6rem;padding:0.35rem 0.55rem;gap:0.4rem
  }
  [code-path="src/components/MadridClock.tsx:1:4"]{display:none}

  /* --- Encabezados: de fila a columna para que no se aprieten --- */
  [code-path="src/components/Dashboard.tsx:35:9"]{flex-direction:column;align-items:flex-start;gap:0.75rem}
  [code-path="src/components/Dashboard.tsx:40:11"]{align-self:flex-start}
  [code-path="src/components/EmpresaView.tsx:51:9"]{flex-direction:column;align-items:flex-start;gap:0.75rem}
  [code-path="src/components/EmpresaView.tsx:62:11"]{text-align:left;align-self:flex-start;width:100%}
  [code-path="src/components/EmpresaView.tsx:65:13"]{width:100%;max-width:12rem}

  /* --- Padding general de las pantallas principales --- */
  [code-path="src/components/Dashboard.tsx:33:7"]{padding:1rem;gap:1.25rem}
  [code-path="src/components/EmpresaView.tsx:49:7"]{padding:1rem}
  [code-path="src/components/Kanban.tsx:39:7"]{padding:1rem}

  /* --- Pestanas (Fases/KPIs/Goals/Tips/Cuaderno): scroll horizontal en vez de amontonarse --- */
  [code-path="src/components/EmpresaView.tsx:93:11"]{
    display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;
    max-width:100%;scrollbar-width:none
  }
  [code-path="src/components/EmpresaView.tsx:93:11"]::-webkit-scrollbar{display:none}
  [code-path="src/components/EmpresaView.tsx:93:11"] button{flex-shrink:0}

  /* --- Tarjetas de KPI/empresa: menos padding, texto mas compacto --- */
  .p-6{padding:1rem}
  .p-5{padding:0.875rem}
  .gap-6{gap:1rem}
  .gap-4{gap:0.65rem}

  /* --- Checkboxes de tareas: objetivo tactil mas grande --- */
  [data-slot="checkbox"]{width:1.25rem;height:1.25rem}

  /* --- Boton de volver: mas aire para el dedo --- */
  [code-path="src/components/EmpresaView.tsx:back"]{padding:0.35rem 0;margin-bottom:0.25rem}
}
@media (max-width:380px){
  [code-path="src/components/EmpresaView.tsx:72:9"]{grid-template-columns:repeat(2,minmax(0,1fr));gap:0.5rem}
}
